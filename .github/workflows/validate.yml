name: Validate

# Every plugin parses, so a broken one is caught before it is installed.
on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  parse:
    name: PHP parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: php -l
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
